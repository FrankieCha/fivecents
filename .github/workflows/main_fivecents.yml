# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - fivecents

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Prepare standalone deployment
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Package standalone app including Next.js assets
        run: zip -qr release.zip . -x release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4DA9D358F9AE418D93F02C198F834209 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_407ED8EEAEA042F8BFC75C1CD5BDF467 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1AF588522A264E5EBE963FF3CAAB5B06 }}

      - name: Deploy clean package to Azure Web App
        run: |
          az webapp deploy \
            --resource-group rg-tokencraze \
            --name fivecents \
            --src-path release.zip \
            --type zip \
            --clean true \
            --restart true \
            --track-status true

